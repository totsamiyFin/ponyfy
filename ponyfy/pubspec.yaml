name: ponyfy
description: MLP-themed proxy client based on Hiddify. Powered by Sing-box.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # UI
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  cached_network_image: ^3.3.1

  # VPN / Proxy core (sing-box bindings — same as hiddify)
  # These are platform channel plugins
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  package_info_plus: ^8.0.0

  # Networking
  dio: ^5.4.3+1
  http: ^1.2.1

  # Utils
  intl: ^0.19.0
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
