name: Build Ponyfy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
      - name: Setup and build
        run: |
          flutter create --org com.ponyfy --project-name ponyfy_base /tmp/ponyfy_base
          cp -r ponyfy/lib /tmp/ponyfy_base/
          cp -r ponyfy/assets /tmp/ponyfy_base/
          cp ponyfy/pubspec.yaml /tmp/ponyfy_base/pubspec.yaml
          cd /tmp/ponyfy_base
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ponyfy-android
          path: /tmp/ponyfy_base/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
      - name: Setup and build
        run: |
          flutter create --org com.ponyfy --project-name ponyfy_base C:\ponyfy_base
          Copy-Item -Recurse -Force ponyfy\lib C:\ponyfy_base\lib
          Copy-Item -Recurse -Force ponyfy\assets C:\ponyfy_base\assets
          Copy-Item -Force ponyfy\pubspec.yaml C:\ponyfy_base\pubspec.yaml
          cd C:\ponyfy_base
          flutter pub get
          flutter build windows --release
          Compress-Archive -Path C:\ponyfy_base\build\windows\x64\runner\Release\* -DestinationPath $env:GITHUB_WORKSPACE\ponyfy-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ponyfy-windows
          path: ponyfy-windows.zip
